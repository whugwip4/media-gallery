    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6e6e3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <text x="600" y="150" text-anchor="middle" font-size="46" font-weight="700" fill="#0e0e0e">Как работает веб-приложение</text>

  <g fill="#ffffff" stroke="#8a8a86" stroke-width="3">
    <rect x="80" y="330" width="280" height="220" rx="28"/>
    <rect x="460" y="330" width="280" height="220" rx="28"/>
    <rect x="840" y="330" width="280" height="220" rx="28"/>
  </g>

  <g fill="#f4f4f2" stroke="#0e0e0e" stroke-width="4">
