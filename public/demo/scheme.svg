    <line x1="170" y1="388" x2="270" y2="388"/>
    <rect x="555" y="364" width="90" height="34" rx="8"/>
    <rect x="555" y="406" width="90" height="34" rx="8"/>
    <path d="M932 376V430A48 14 0 0 0 1028 430V376"/>
    <path d="M932 403A48 14 0 0 0 1028 403" fill="none"/>
    <ellipse cx="980" cy="376" rx="48" ry="14"/>
  </g>
  <g fill="#0e0e0e">
    <circle cx="625" cy="381" r="5"/>
    <circle cx="625" cy="423" r="5"/>
  </g>

  <g text-anchor="middle">
    <text x="220" y="490" font-size="30" font-weight="700" fill="#0e0e0e">Браузер</text>
    <text x="220" y="524" font-size="20" fill="#6b6b6b">страницы и формы</text>
    <text x="600" y="490" font-size="30" font-weight="700" fill="#0e0e0e">Сервер Next.js</text>
    <text x="600" y="524" font-size="20" fill="#6b6b6b">логика и файлы</text>
    <text x="980" y="490" font-size="30" font-weight="700" fill="#0e0e0e">MySQL</text>
    <text x="980" y="524" font-size="20" fill="#6b6b6b">пользователи, материалы</text>
  </g>

  <g stroke-width="5" marker-end="url(#arrow)">
    <line x1="372" y1="410" x2="448" y2="410" stroke="#0e0e0e"/>
    <line x1="448" y1="470" x2="372" y2="470" stroke="#6b6b6b"/>
